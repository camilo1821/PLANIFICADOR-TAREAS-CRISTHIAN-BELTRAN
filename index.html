<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador De Tareas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Grechen+Fuemen&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header id="app-header"></header>


    <div class="container-fluid d-flex justify-content-center align-items-start py-5 min-vh-100">

        <div class="col-12 col-md-10 col-lg-8 col-xl-6">

            <div id="formulario" class="card text-bg-light">
                <div class="card-body">

                    <form id="formulario-tarea" class="row g-3 needs-validation" novalidate>
                        <div class="col-12 position-relative">
                            <label for="dato-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="dato-nombre" placeholder="Nombre de la tarea"
                                required>
                            <div id="validacion-nombre" class="invalid-feedback">
                                Looks good!
                            </div>
                        </div>


                        <div class="col-12">
                            <label for="dato-descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="dato-descripcion" placeholder="Describa la tarea"
                                required></textarea>
                            <div id="validacion-descripcion" class="invalid-feedback">
                                Please enter a message in the textarea.
                            </div>
                        </div>


                        <div class="col-12 col-md-6 position-relative">
                            <label for="dato-asignado" class="form-label">Asignado A</label>
                            <input type="text" class="form-control" id="dato-asignado" placeholder="Asignado A"
                                required>
                            <div id="validacion-asignado" class="invalid-feedback">
                                Please select a valid name.
                            </div>
                        </div>

                        <div class="col-12 col-md-6 position-relative">
                            <label for="dato-estado" class="form-label">Estado de la tarea</label>
                            <select class="form-select" id="dato-estado" required>
                                <option id="dato-opcion" selected disabled value="">Estado</option>
                                <option>Inciada</option>
                                <option>En progreso</option>
                                <option>Terminada</option>
                            </select>
                            <div id="validacion-estado" class="invalid-feedback">
                                Please select a valid state.
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="dato-fecha" class="form-label">Fecha De Entrega</label>
                            <input type="date" class="form-control" id="dato-fecha" required>
                            <div id="validacion-fecha" class="invalid-feedback" ></div>
                        </div>

                        <div class="col-12">
                            <button id="boton-crear" class="btn btn-info" type="submit">Crear tarea</button>
                        </div>
                        <div id="mensaje-enviado"></div>
                    </form>

                </div>
            </div>

            <!-- en esta sección se pintan las tarjetas de las nuevas tareas -->
        
            <section id="lista-tareas" class="row g-3 mt-3"></section>

        </div>
    </div>

    <footer id="app-footer"></footer>


    <script type="module" src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
